<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Hub</title>
<meta name="theme-color" content="#312e81">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<script>
/* =========================================================
 *  Work Hub — সব অ্যাপের আজকের হিসাব এক পাতায়
 *  API_URL = Hub-এর Apps Script ("Anyone" deployment) /exec লিংক।
 *  পেজ public — কোনো গোপন তথ্য নেই; নিরাপত্তা লগইন টোকেন + PIN থেকে।
 *  ?demo দিয়ে খুললে নমুনা ডেটা (সার্ভার ছাড়া ডিজাইন দেখার জন্য)।
 * ========================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbzuidqRjNhhaPSwKSrG-PJBm0KxQIGazAoC3IBBBkgIRPzxjZmZKqClWnf-Pm6yC5Ei/exec';
var DEMO = /[?&]demo\b/.test(location.search);

// github.io-র সব রিপোজিটরি একই storage ভাগ করে — তাই সব key-তে "hub_"
var AUTH_KEY = 'hub_auth';
var AUTH = '';
try { AUTH = localStorage.getItem(AUTH_KEY) || ''; } catch (e) {}
if (DEMO) AUTH = 'demo';
function setAuth(t) {
  AUTH = t || '';
  try { if (AUTH) localStorage.setItem(AUTH_KEY, AUTH); else localStorage.removeItem(AUTH_KEY); } catch (e) {}
}

/* সাজানোর পছন্দ — আগে এই ব্রাউজারের কপি, পরে সার্ভারের (সব ডিভাইসে এক) */
var PREF_DEF = {
  order: ['todo', 'entrylab', 'cbt', 'invoice', 'tpl'], hidden: [], collapsed: [],
  density: 'full', chips: true, theme: 'auto', accent: 'brand', cols: 'auto', refresh: 2, name: 'বস', ts: 0
};
var P = JSON.parse(JSON.stringify(PREF_DEF));
try { var _p = JSON.parse(localStorage.getItem('hub_prefs') || 'null'); if (_p) for (var k in _p) P[k] = _p[k]; } catch (e) {}

// থিম আর রং রেন্ডারের আগেই বসাই — ঝলক দেখায় না
function applyLook() {
  var t = P.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : P.theme;
  var r = document.documentElement;
  r.setAttribute('data-theme', t);
  r.setAttribute('data-accent', P.accent);
  r.setAttribute('data-density', P.density);
  r.setAttribute('data-cols', P.cols);
}
applyLook();

/* text/plain POST — preflight ছাড়াই সরাসরি Apps Script-এ */
function callServer(fn, args) {
  if (DEMO) return demoCall(fn, args || []);
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], auth: AUTH })
  }).then(function (r) {
    if (!r.ok) throw new Error('সার্ভার সাড়া দিচ্ছে না (' + r.status + ') — একটু পরে আবার চেষ্টা করুন।');
    return r.json().catch(function () { throw new Error('সার্ভারের উত্তর বোঝা যায়নি।'); });
  }, function () {
    throw new Error('সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট সংযোগ দেখুন।');
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'অজানা সমস্যা।');
    return j.data;
  });
}

/* ব্যক্তিগত লোগো "Matra Logic" — মাত্রা + A/λ + নোড + জ্বলা-নেভা কার্সর ("আ") */
function markSvg(cls) {
  return '<svg class="mk ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
    '<path d="M8 18H92M16 88 40 18 64 88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path class="cur" d="M84 18V88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round"/>' +
    '<circle cx="40" cy="64" r="7.5" fill="url(#mkg)"/></svg>';
}
</script>
<style>
:root{
  --bg:#f4f4fb; --card:#ffffff; --ink:#141834; --ink2:#4a5072; --ink3:#878cab;
  --line:#e7e8f3; --soft:#f5f5fc; --shadow:0 1px 2px rgba(20,24,60,.05),0 8px 24px rgba(20,24,60,.06);
  --pos:#14915a; --neg:#d6334a; --top:rgba(255,255,255,.8);
  --m1:#4f46e5; --m2:#7c3aed; --m3:#c026d3;
  --acc:#6d28d9; --grad:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#c026d3);
}
[data-theme=dark]{
  --bg:#0d0f20; --card:#171a34; --ink:#eef0ff; --ink2:#b5b9dc; --ink3:#7d82a8;
  --line:#272b4d; --soft:#1f2342; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --pos:#3ccf8e; --neg:#ff6b81; --top:rgba(16,18,38,.82);
  --m1:#818cf8; --m2:#a78bfa; --m3:#e879f9; --acc:#a78bfa;
}
[data-accent=indigo]{--acc:#4f46e5;--grad:linear-gradient(135deg,#4f46e5,#6366f1)}
[data-accent=teal]{--acc:#0d9488;--grad:linear-gradient(135deg,#0f766e,#14b8a6)}
[data-accent=rose]{--acc:#e11d48;--grad:linear-gradient(135deg,#be123c,#f43f5e)}
[data-accent=amber]{--acc:#d97706;--grad:linear-gradient(135deg,#b45309,#f59e0b)}
[data-theme=dark][data-accent=indigo]{--acc:#818cf8} [data-theme=dark][data-accent=teal]{--acc:#2dd4bf}
[data-theme=dark][data-accent=rose]{--acc:#fb7185} [data-theme=dark][data-accent=amber]{--acc:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
/* পেছনে রঙিন gradient — লোগোর নীল/বেগুনি/গোলাপি আভা, একেবারে সাদা নয় */
body{font-family:'Hind Siliguri','Inter','Nirmala UI',system-ui,sans-serif;min-height:100vh;
  background:radial-gradient(900px 620px at -5% -10%,rgba(99,102,241,.30),transparent 62%),
             radial-gradient(820px 600px at 105% 5%,rgba(192,38,211,.22),transparent 60%),
             radial-gradient(1000px 700px at 50% 115%,rgba(14,165,233,.20),transparent 62%),
             linear-gradient(160deg,#e9ebff 0%,#f3ecff 45%,#fcecf6 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
[data-theme=dark] body{
  background:radial-gradient(900px 620px at -5% -10%,rgba(79,70,229,.35),transparent 62%),
             radial-gradient(820px 600px at 105% 5%,rgba(192,38,211,.22),transparent 60%),
             radial-gradient(1000px 700px at 50% 115%,rgba(14,116,144,.25),transparent 62%),
             linear-gradient(160deg,#0f1030 0%,#160f2e 50%,#1d0c26 100%);
  background-attachment:fixed}
button,input{font-family:inherit}
button{cursor:pointer}
.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
[hidden]{display:none!important}
/* শুভেচ্ছার হাসিখুশি মেয়ের ছবি — একটু মাথা দোলায় */
.girl{width:44px;height:44px;vertical-align:-11px;margin-left:6px;transform-origin:50% 90%;animation:nod 2.6s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}60%{transform:rotate(5deg)}}

/* ---------- লগইন ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 18% 14%,#4f46e5 0,transparent 45%),radial-gradient(circle at 86% 90%,#c026d3 0,transparent 42%),#15122e}
.lg-card{width:100%;max-width:370px;background:#fff;color:#1a1a2e;border-radius:24px;padding:30px 22px 20px;
  box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center;--m1:#4f46e5;--m2:#7c3aed;--m3:#c026d3}
.lg-card .mk{width:74px;height:74px;display:block;margin:0 auto 12px}
.lg-card h1{font:800 24px 'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;margin-bottom:2px}
.lg-card .sub{font-size:13.5px;color:#77779a;margin-bottom:20px}
.lg-card label{display:block;text-align:left;font-size:13px;font-weight:700;color:#444;margin:0 0 5px}
.lg-card input{width:100%;padding:13px 14px;border:2px solid #e1e5f0;border-radius:13px;font:600 16px 'Inter',sans-serif;outline:none;color:#1a1a2e;background:#fff}
.lg-card input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.lg-card input.code{letter-spacing:8px;text-align:center;font-size:22px}
.lg-btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px;color:#fff;font-size:15.5px;font-weight:700;
  background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#c026d3);box-shadow:0 8px 20px rgba(124,58,237,.35)}
.lg-btn:disabled{opacity:.6;cursor:wait}
.lg-msg{min-height:20px;margin-top:10px;font-size:13px;font-weight:600;color:#c0392b;line-height:1.5}
.lg-msg.ok{color:#2d6a4f}
.lg-link{background:none;border:0;color:#6d28d9;font-size:13px;font-weight:700;margin-top:8px}
.lg-foot{margin-top:16px;font-size:12px;color:#9a97b5}
.lg-foot b{font:800 12.5px 'Plus Jakarta Sans','Inter',sans-serif;color:#4c4a6e}

/* ---------- উপরের বার ---------- */
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--top);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand .tile{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.brand .mk{width:28px;height:28px}
.brand b{display:block;font:800 17.5px 'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:16px;flex:none}
.ib:hover{border-color:var(--acc)}
.ib .lbl{font-size:13.5px;font-weight:700}
.ib.pri{background:var(--grad);color:#fff;border-color:transparent}
.ib.spin .ri{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.menu{position:absolute;right:16px;top:60px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--ink);padding:11px 12px;border-radius:9px;font-size:14.5px;text-align:left}
.menu button:hover{background:var(--soft)}

/* ---------- মূল অংশ ---------- */
main{max-width:1200px;margin:0 auto;padding:18px 16px 30px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hello h2{font-size:23px;font-weight:700;line-height:1.25}
.hello h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{font-size:13.5px;color:var(--ink3);margin-top:2px}
.sync{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--pos);display:inline-block}
.sync.busy i{background:var(--acc);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 12px;box-shadow:var(--shadow);
  display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;min-width:0;transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip i{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:17px;flex:none}
.chip div{min-width:0}
.chip small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{display:block;font:700 16.5px 'Inter',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
[data-cols="2"] .grid{grid-template-columns:repeat(2,1fr)}
[data-cols="3"] .grid{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.ch{display:flex;align-items:center;gap:11px;padding:16px 14px 10px 16px;cursor:pointer;user-select:none}
.ch i{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:19px;
  background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.ch div{flex:1;min-width:0}
.ch b{display:block;font-size:16.5px;font-weight:700;line-height:1.2}
.ch small{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch a{font-size:13px;font-weight:700;color:var(--c);text-decoration:none;white-space:nowrap;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.ch .cv{width:30px;height:30px;border-radius:9px;border:0;background:var(--soft);color:var(--ink3);font-size:13px;transition:transform .2s;flex:none}
.card.closed .cv{transform:rotate(-90deg)}
.card.closed .cb{display:none}
.card.closed .ch{padding-bottom:14px}
.cb{padding:4px 16px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.two{grid-template-columns:1fr 1fr}
.stat{background:var(--soft);border-radius:12px;padding:10px 11px;min-width:0}
.stat small{display:block;font-size:12px;color:var(--ink3);line-height:1.3}
.stat b{display:block;font:700 19px 'Inter',sans-serif;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b em{font-style:normal;font-size:12px;color:var(--ink3);font-weight:600;margin-left:3px}
.stat.hl{background:color-mix(in srgb,var(--c) 12%,transparent)}
.stat.hl b{color:var(--c)}
.stat.bad b{color:var(--neg)} .stat.good b{color:var(--pos)}
.sec{font-size:12.5px;font-weight:700;color:var(--ink3);margin:14px 0 7px;display:flex;justify-content:space-between;gap:8px}
.sec span{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.barline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:6px;gap:8px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 10px;border-radius:10px;background:var(--soft);min-width:0}
.li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li em{font-style:normal;font-size:12px;color:var(--ink3);white-space:nowrap}
.pr{font:700 10.5px 'Inter',sans-serif;padding:2px 7px;border-radius:99px;flex:none}
.pr.Must{background:#fde2e6;color:#b4233a} .pr.Should{background:#fff1d6;color:#9a5b00} .pr.Could{background:#e3f1ff;color:#1d5fa8}
[data-theme=dark] .pr.Must{background:#4a1a26;color:#ff9aac} [data-theme=dark] .pr.Should{background:#45330f;color:#ffcf7a} [data-theme=dark] .pr.Could{background:#173150;color:#9cc9ff}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--ink2)}
.tag b{font-family:'Inter',sans-serif;color:var(--ink)}
.tag.bad{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
.big{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.big small{font-size:13px;color:var(--ink2);font-weight:600}
.big b{font:800 21px 'Inter',sans-serif;color:var(--c)}
.ring{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.ring svg{flex:none}
.ring p{font-size:14px;color:var(--ink2);line-height:1.5}
.ring p b{font-family:'Inter',sans-serif;color:var(--ink)}
.note{font-size:13px;color:var(--ink3);background:var(--soft);border-radius:10px;padding:9px 11px;margin-top:10px}
[data-density=compact] .more{display:none!important}
[data-density=compact] .cb{padding-bottom:14px}
.err{padding:14px;border-radius:12px;background:color-mix(in srgb,var(--neg) 9%,transparent);color:var(--neg);font-size:13.5px;line-height:1.5}
.err button{margin-top:8px;border:0;background:var(--neg);color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.3s infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 16px;color:var(--ink3);font-size:14.5px}
.empty button{margin-top:10px}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--ink3);margin-top:26px}
.foot .mk{width:20px;height:20px}
.foot b{font:800 13px 'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink2)}

/* ---------- শিট (সাজান / নিরাপত্তা) ---------- */
.ov{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 26px}
@media(min-width:720px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:18px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h4{font-size:14px;margin:18px 0 8px;color:var(--ink2)}
.sheet p{font-size:13px;color:var(--ink3);line-height:1.5}
.row{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:12px;background:var(--soft);margin-bottom:6px;font-size:14.5px}
.row span{flex:1;min-width:0;overflow-wrap:anywhere}
.row small{display:block;font-size:12px;color:var(--ink3)}
.row .ai{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.row.off span{opacity:.5}
.mv{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}
.mv:disabled{opacity:.3;cursor:default}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);border:0;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--acc)} .sw.on::after{left:21px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}

<script>
(function () {
  var MODE = '', IDLE = 15 * 60000, MINLEN = 4, KEY = 'hub_appLockLast';
  var root = document.documentElement, box = document.getElementById('alLock');
  function $(id) { return document.getElementById(id); }
  function bn(n) { return String(n).replace(/[0-9]/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); }
  var mode = '', locked = true, busy = false, mem = 0, lastWrite = 0, loginWait = false;

  function readLast() { var v = 0; try { v = Number(localStorage.getItem(KEY)) || 0; } catch (e) {} return Math.max(v, mem); }
  function writeLast(t) { mem = t; lastWrite = Date.now(); try { localStorage.setItem(KEY, String(t)); } catch (e) {} }
  function stale() { return Date.now() - readLast() > IDLE; }

  var TEXT = {
    wait:   { sub: '⏳ একটু অপেক্ষা করুন...', a: 'Please Enter the Pin', btn: 'Enter', busy: '', sw: '' },
    unlock: { sub: '', a: 'Please Enter the Pin', btn: 'Enter', busy: 'Logging IN...', sw: '🔑 PIN change?' },
    setup:  { sub: 'নতুন PIN ঠিক করুন — এরপর থেকে Hub খুলতে এই PIN লাগবে। অন্তত ' + bn(MINLEN) + ' অক্ষর।',
              a: 'New PIN', b: 'Confirm PIN', btn: 'Set PIN', busy: '⏳ সেভ হচ্ছে...', sw: '' },
    change: { sub: 'আগে বর্তমান PIN দিন, তারপর নতুন PIN।',
              a: 'Current PIN', b: 'New PIN', c: 'Confirm new PIN', btn: 'Change PIN', busy: '⏳ যাচাই হচ্ছে...', sw: '← ফিরে যান' }
  };
  function setMode(m) {
    mode = m; var t = TEXT[m];
    $('alSub').textContent = t.sub; $('alBtn').textContent = t.btn; $('alBtn').disabled = m === 'wait';
    $('alLa').textContent = t.a; $('alLb').textContent = t.b || ''; $('alLc').textContent = t.c || '';
    $('alFb').style.display = t.b ? '' : 'none'; $('alFc').style.display = t.c ? '' : 'none';
    $('alSwitch').textContent = t.sw; $('alSwitch').style.display = t.sw ? '' : 'none';
    $('alA').value = $('alB').value = $('alC').value = ''; msg(''); focusA();
  }
  function focusA() { setTimeout(function () { try { $('alA').focus(); } catch (e) {} }, 30); }
  function msg(s, ok) { var e = $('alErr'); e.textContent = s; e.className = 'al-err' + (ok ? ' ok' : ''); }

  function lock() {
    if (!AUTH) { waitForLogin(); return; }
    locked = true; loginWait = false;
    root.removeAttribute('data-al-open');
    if (document.activeElement && !box.contains(document.activeElement)) { try { document.activeElement.blur(); } catch (e) {} }
    if (MODE) { setMode(MODE); return; }
    setMode('wait');
    callServer('appLockMode', []).then(function (m) {
      MODE = m === 'setup' ? 'setup' : 'unlock';
      if (locked && mode === 'wait') setMode(MODE);
    }, function (err) {
      if (/AUTH_REQUIRED/.test(err.message)) { setAuth(''); window.showLogin && showLogin(); waitForLogin(); return; }
      msg(err.message); $('alBtn').disabled = false; $('alBtn').textContent = '🔄 আবার চেষ্টা';
    });
  }
  function unlock() {
    locked = false; loginWait = false; writeLast(Date.now());
    $('alA').value = $('alB').value = $('alC').value = '';
    root.setAttribute('data-al-open', '');
  }
  function waitForLogin() { locked = false; loginWait = true; root.setAttribute('data-al-open', ''); }
  window.appLockWaitLogin = waitForLogin;
  window.appLockAfterLogin = function () { if (stale()) lock(); else unlock(); };
  window.appLockNow = function () { writeLast(0); mem = 0; lock(); };

  function check() { if (!locked && !loginWait && stale()) lock(); }
  function activity() {
    if (locked || loginWait) return;
    if (stale()) { lock(); return; }
    var n = Date.now(); mem = n;
    if (n - lastWrite > 15000) writeLast(n);
  }
  function run(fn, args, ok) {
    var btn = $('alBtn'), label = btn.textContent;
    busy = true; btn.disabled = true; btn.textContent = TEXT[mode].busy; msg('');
    var done = function () { busy = false; btn.disabled = false; btn.textContent = label; };
    callServer(fn, args).then(function () { done(); ok(); }, function (err) {
      done();
      if (/AUTH_REQUIRED/.test(err.message)) { setAuth(''); window.showLogin && showLogin(); waitForLogin(); return; }
      msg(String(err.message).replace(/^(Exception|Error):\s*/, ''));
      try { $('alA').select(); } catch (e) {}
    });
  }
  $('alForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    if (mode === 'wait') { lock(); return; }
    var a = $('alA').value.trim(), b = $('alB').value.trim(), c = $('alC').value.trim();
    if (mode === 'unlock') {
      if (!a) { msg('PIN লিখুন।'); focusA(); return; }
      run('appLockUnlock', [a], unlock);
    } else if (mode === 'setup') {
      if (a.length < MINLEN) { msg('PIN অন্তত ' + bn(MINLEN) + ' অক্ষরের দিন।'); focusA(); return; }
      if (a !== b) { msg('দুইবার একই PIN লিখুন।'); $('alB').focus(); return; }
      run('appLockSetup', [a], function () { MODE = 'unlock'; unlock(); });
    } else {
      if (!a) { msg('বর্তমান PIN লিখুন।'); focusA(); return; }
      if (b.length < MINLEN) { msg('নতুন PIN অন্তত ' + bn(MINLEN) + ' অক্ষরের দিন।'); $('alB').focus(); return; }
      if (b !== c) { msg('নতুন PIN দুইবার একই লিখুন।'); $('alC').focus(); return; }
      run('appLockChange', [a, b], function () { msg('✅ PIN বদলানো হয়েছে।', true); setTimeout(unlock, 900); });
    }
  });
  $('alSwitch').addEventListener('click', function () { if (!busy) setMode(mode === 'change' ? 'unlock' : 'change'); });
  $('alEye').addEventListener('click', function () {
    var on = box.classList.toggle('al-show');
    this.textContent = on ? '🙈 Hide PIN' : '👁 Show PIN'; focusA();
  });
  ['keydown', 'keypress', 'keyup'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      if (locked && !box.contains(e.target)) { e.stopImmediatePropagation(); e.preventDefault(); if (t === 'keydown') focusA(); }
    }, true);
  });
  ['pointerdown', 'mousemove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(function (t) {
    document.addEventListener(t, activity, { capture: true, passive: true });
  });
  document.addEventListener('visibilitychange', check);
  window.addEventListener('focus', check);
  window.addEventListener('pagehide', function () { if (!locked && mem) writeLast(mem); });
  setInterval(check, 15000);

  if (DEMO || !AUTH) waitForLogin();
  else if (!stale()) unlock();
  else lock();
})();
</script>

<script>
/* ═════════════════════════ অ্যাপ ═════════════════════════ */
var $ = function (id) { return document.getElementById(id); };
var APPS = {
  todo:     { name: 'Daily To-Do',      ico: '✅', c: '#4f46e5', url: 'https://m-ashraful.github.io/todo/' },
  entrylab: { name: 'EntryLab',         ico: '⌨️', c: '#0098e8', url: 'https://m-ashraful.github.io/entrylab/' },
  cbt:      { name: 'CBT Admin',        ico: '👥', c: '#0f9d6b', url: 'https://m-ashraful.github.io/cbt/admin/' },
  invoice:  { name: 'Retailer Invoice', ico: '🧾', c: '#e0313b', url: 'https://tpl-invoice.github.io/' },
  tpl:      { name: 'TP Inventory',     ico: '📦', c: '#8b3fd9', url: 'https://tpl-inventory.github.io/' }
};
var ALL_IDS = Object.keys(APPS);
var S = { data: null, loading: false, err: '', pending: {} };
var CACHE_KEY = 'hub_c1';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n0(v) { return (Number(v) || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
function n2(v) { return (Number(v) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
function tk(v) { return '৳' + n0(v); }
function pct(a, b) { return b > 0 ? Math.max(0, Math.min(100, Math.round(a / b * 100))) : 0; }
function hm(mins) { mins = Math.round(Number(mins) || 0); var h = Math.floor(mins / 60), m = mins % 60; return h ? h + 'h ' + m + 'm' : m + 'm'; }
function ago(t) {
  if (!t) return '';
  var s = Math.round((Date.now() - t) / 1000);
  if (s < 50) return 'এইমাত্র';
  if (s < 3600) return Math.round(s / 60) + ' মিনিট আগে';
  return new Date(t).toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' });
}
function toast(m) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
}
function ring(p) {
  var r = 26, L = 2 * Math.PI * r, d = L * p / 100;
  return '<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="' + r + '" fill="none" stroke="var(--soft)" stroke-width="7"/>' +
    '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="var(--c)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + d + ' ' + L + '" transform="rotate(-90 32 32)"/>' +
    '<text x="32" y="37" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="var(--ink)">' + p + '%</text></svg>';
}
function stat(label, val, cls, sub) {
  return '<div class="stat' + (cls ? ' ' + cls : '') + '"><small>' + label + '</small><b class="num">' + val + (sub ? '<em>' + sub + '</em>' : '') + '</b></div>';
}

/* ---------- পছন্দ (সাজানো) ----------
 * order = কার্ডের ক্রম, hidden = লুকানো, collapsed = ছোট করা কার্ড। এই ব্রাউজারে সাথে সাথে,
 * সার্ভারে একটু পরে (সব ডিভাইসে এক)। নতুন অ্যাপ যোগ হলে order-এর শেষে বসে। */
function fixPrefs() {
  if (P.v !== 2) { if (!P.name) P.name = 'বস'; P.v = 2; }   // আগের সংস্করণে নাম ফাঁকা থাকত
  P.order = (P.order || []).filter(function (id) { return APPS[id]; });
  ALL_IDS.forEach(function (id) { if (P.order.indexOf(id) === -1) P.order.push(id); });
  ['hidden', 'collapsed'].forEach(function (k) { P[k] = (P[k] || []).filter(function (id) { return APPS[id]; }); });
}
fixPrefs();
var saveT = 0;
function savePrefs(toServer) {
  P.ts = Date.now();
  try { localStorage.setItem('hub_prefs', JSON.stringify(P)); } catch (e) {}
  if (toServer === false || DEMO) return;
  clearTimeout(saveT);
  saveT = setTimeout(function () { callServer('apiSavePrefs', [P]).catch(function () {}); }, 900);
}
function setPref(k, v) { P[k] = v; applyLook(); savePrefs(); render(); restartAuto(); }
function loadServerPrefs() {
  if (DEMO) return;
  callServer('apiPrefs', []).then(function (sp) {
    if (sp && sp.ts && sp.ts > (P.ts || 0)) {
      for (var k in PREF_DEF) if (sp[k] !== undefined) P[k] = sp[k];
      fixPrefs(); applyLook(); savePrefs(false); header(); render(); restartAuto();
    }
  }).catch(function () {});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (P.theme === 'auto') applyLook(); });

/* ---------- প্রতিটা অ্যাপের কার্ড ----------
 * class="more" অংশগুলো "সংক্ষিপ্ত" দেখায় লুকায় */
var BODY = {
  todo: function (d) {
    if (!d.total && !d.overdue) return '<div class="note">আজকের জন্য কোনো কাজ যোগ করা নেই।</div>';
    var p = pct(d.done, d.total);

/* প্রতিটা অ্যাপের জন্য আলাদা কল, একসাথে — যেটা আগে আসে তার কার্ড আগে ভরে
 * (CBT-র হিসাব বেশি সময় নেয়, বাকিরা তার জন্য অপেক্ষা করে না) */
function load(force) {
  if (S.loading) return;
  var ids = visibleIds();
  if (!ids.length) { render(); return; }
  S.loading = true; S.err = ''; S.pending = {};
  $('refBtn').classList.add('spin');
  if (!S.data) S.data = { at: 0, apps: {} };
  var left = ids.length, authGone = false;
  ids.forEach(function (id) {
    S.pending[id] = 1;
    callServer('apiSummary', [!!force, id]).then(function (d) {
      var r = d && d.apps && d.apps[id];
      if (r && (r.ok || !(S.data.apps[id] && S.data.apps[id].ok))) S.data.apps[id] = r;
    }, function (err) {
      if (/AUTH_REQUIRED/.test(err.message)) { authGone = true; return; }
      S.err = err.message;
      if (!(S.data.apps[id] && S.data.apps[id].ok)) S.data.apps[id] = { ok: false, error: err.message };
    }).then(function () {
      delete S.pending[id];
      if (--left > 0) { render(); return; }
      S.loading = false; $('refBtn').classList.remove('spin');
      if (authGone) { logoutLocal(); return; }
      S.data.at = Date.now();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(S.data)); } catch (e) {}
      if (force && !S.err) toast('✓ হালনাগাদ হয়েছে');
      render();
    });
  });
  render();
}

}
document.addEventListener('visibilitychange', function () {

function showApp() {
  $('login').hidden = true; $('app').hidden = false;

/* ---------- লগইন ---------- */
var LG = { email: '' };
function showLogin() {
  $('app').hidden = true; $('login').hidden = false;
  lgStep(1);
  if (window.appLockWaitLogin) appLockWaitLogin();
}
function lgStep(n) {
  $('lgStep1').hidden = n !== 1; $('lgStep2').hidden = n !== 2; $('lgBack').hidden = n !== 2;
  $('lgBtn').textContent = n === 1 ? 'কোড পাঠান' : 'লগইন';
  lgMsg(n === 2 ? LG.email + ' — ইনবক্সে কোড গেছে (Spam-ও দেখুন)।' : '', true);
  setTimeout(function () { (n === 1 ? $('lgEmail') : $('lgCode')).focus(); }, 30);
}
function lgMsg(m, ok) { var e = $('lgMsg'); e.textContent = m; e.className = 'lg-msg' + (ok ? ' ok' : ''); }
function device() {
  var u = navigator.userAgent;
  var os = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iPhone' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'অন্য';
  var br = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Browser';
  return os + ' · ' + br;
}
$('lgForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('lgBtn'); if (btn.disabled) return;
  var step1 = !$('lgStep1').hidden;
  var done = function () { btn.disabled = false; btn.textContent = step1 ? 'কোড পাঠান' : 'লগইন'; };
  if (step1) {
    var em = $('lgEmail').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { lgMsg('ঠিক ইমেইল লিখুন।'); return; }
    btn.disabled = true; btn.textContent = '⏳ পাঠানো হচ্ছে…'; lgMsg('');
    callServer('apiSendCode', [em]).then(function () { LG.email = em; done(); lgStep(2); }, function (err) { done(); lgMsg(err.message); });
  } else {
    var code = $('lgCode').value.replace(/\D/g, '');
    if (code.length !== 6) { lgMsg('৬ সংখ্যার কোড লিখুন।'); return; }
    btn.disabled = true; btn.textContent = '⏳ যাচাই হচ্ছে…'; lgMsg('');
    callServer('apiVerifyCode', [LG.email, code, device()]).then(function (tok) {
      done(); setAuth(tok); $('lgCode').value = '';
      showApp();
      if (window.appLockAfterLogin) appLockAfterLogin();
    }, function (err) { done(); lgMsg(err.message); });
  }
});
$('lgBack').addEventListener('click', function () { lgStep(1); });

function logoutLocal() {
  setAuth(''); S.data = null;
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  showLogin();
}

var ACCENTS = [['brand', 'linear-gradient(135deg,#4f46e5,#7c3aed,#c026d3)', 'আমার ব্র্যান্ড'], ['indigo', '#4f46e5', 'নীল'], ['teal', '#0d9488', 'সবুজ-নীল'], ['rose', '#e11d48', 'গোলাপি'], ['amber', '#d97706', 'কমলা']];
function customizeHtml() {
  var rows = P.order.map(function (id, i) {
    var a = APPS[id], on = P.hidden.indexOf(id) === -1;
    return '<div class="row' + (on ? '' : ' off') + '"><span class="ai" style="background:color-mix(in srgb,' + a.c + ' 14%,transparent)">' + a.ico + '</span>' +
      '<span>' + esc(a.name) + '</span>' +
      '<button class="mv" data-mv="' + i + ':-1"' + (i === 0 ? ' disabled' : '') + ' title="উপরে">▲</button>' +
      '<button class="mv" data-mv="' + i + ':1"' + (i === P.order.length - 1 ? ' disabled' : '') + ' title="নিচে">▼</button>' +
      '<button class="sw' + (on ? ' on' : '') + '" data-show="' + id + '" title="দেখান/লুকান"></button></div>';
  }).join('');
  return '<p>যা বদলাবেন সাথে সাথে পেছনে দেখা যাবে — ফোন আর PC দুটোতেই একই থাকবে।</p>' +
    '<h4>কার্ড — ক্রম আর দেখানো/লুকানো</h4>' + rows +
    '<h4>দেখার ধরন</h4>' + seg('density', [['full', '📋 বিস্তারিত'], ['compact', '🔹 সংক্ষিপ্ত']]) +
    '<div class="row" style="margin-top:10px"><span>উপরের ছোট সারাংশ</span><button class="sw' + (P.chips ? ' on' : '') + '" data-chips></button></div>' +
    '<h4>থিম</h4>' + seg('theme', [['light', '☀️ আলো'], ['dark', '🌙 অন্ধকার'], ['auto', '🖥️ অটো']]) +
    '<h4>রং</h4><div class="sws">' + ACCENTS.map(function (c) {
      return '<button class="swc' + (P.accent === c[0] ? ' on' : '') + '" data-acc="' + c[0] + '" title="' + c[2] + '" style="background:' + c[1] + '"></button>';
    }).join('') + '</div>' +
    '<h4>কলাম (কম্পিউটারে)</h4>' + seg('cols', [['auto', 'অটো'], ['2', '২টা'], ['3', '৩টা']]) +
    '<h4>নিজে থেকে হালনাগাদ</h4>' + seg('refresh', [[0, 'বন্ধ'], [2, '২ মিনিট'], [5, '৫ মিনিট'], [15, '১৫ মিনিট']]) +
    '<h4>শুভেচ্ছায় আপনার নাম</h4><input class="tin" id="cuName" maxlength="30" placeholder="যেমন: বস" value="' + esc(P.name) + '">' +
    '<div style="display:flex;justify-content:space-between;margin-top:18px;gap:10px"><button class="sbtn" id="cuReset">↺ আগের মতো করুন</button><button class="sbtn pri" id="cuDone">✓ হয়ে গেছে</button></div>';
}
function openCustomize() { openSheet('⚙️ সাজান', customizeHtml()); bindCustomize(); }
function refreshCustomize() { var y = $('shBody').parentNode.scrollTop; $('shBody').innerHTML = customizeHtml(); bindCustomize(); $('shBody').parentNode.scrollTop = y; }
function bindCustomize() {
  var b = $('shBody');
  b.querySelectorAll('[data-mv]').forEach(function (x) { x.onclick = function () {
    var p = x.dataset.mv.split(':'), i = +p[0], j = i + (+p[1]), o = P.order;
    var t = o[i]; o[i] = o[j]; o[j] = t;
    savePrefs(); render(); refreshCustomize();
  }; });
  b.querySelectorAll('[data-show]').forEach(function (x) { x.onclick = function () {
    var id = x.dataset.show, i = P.hidden.indexOf(id);
    if (i === -1) P.hidden.push(id); else { P.hidden.splice(i, 1); if (!(S.data && S.data.apps[id])) setTimeout(function () { load(false); }, 50); }
    savePrefs(); render(); refreshCustomize();
  }; });
  b.querySelectorAll('[data-seg]').forEach(function (g) { g.querySelectorAll('button').forEach(function (x) { x.onclick = function () {
    var k = g.dataset.seg, v = x.dataset.v;
    setPref(k, k === 'refresh' ? Number(v) : v); refreshCustomize();
  }; }); });
  b.querySelectorAll('[data-acc]').forEach(function (x) { x.onclick = function () { setPref('accent', x.dataset.acc); refreshCustomize(); }; });
  b.querySelector('[data-chips]').onclick = function () { setPref('chips', !P.chips); refreshCustomize(); };
  $('cuName').oninput = function () { P.name = this.value.trim().slice(0, 30); savePrefs(); header(); };
  $('cuReset').onclick = function () {
    if (!confirm('সব সাজানো আগের মতো করবেন?')) return;
    var keepTs = Date.now(); P = JSON.parse(JSON.stringify(PREF_DEF)); P.ts = keepTs;
    applyLook(); savePrefs(); header(); render(); restartAuto(); refreshCustomize();
  };
  $('cuDone').onclick = closeOv;
}

/* ---------- 🛡️ নিরাপত্তা ---------- */
function openSecurity() {
  openSheet('🛡️ নিরাপত্তা', '<div class="sk"></div><div class="sk"></div>');
  secCall('apiSecurity', []);
}
function secCall(fn, args) {
  callServer(fn, args).then(secRender, function (err) {
    if ($('shBody')) $('shBody').insertAdjacentHTML('afterbegin', '<div class="err" style="margin-bottom:10px">' + esc(err.message) + '</div>');
  });
}
function secRender(s) {
  var b = $('shBody'); if (!b) return;
  if (s.notOwner) { b.innerHTML = '<p>আপনি (' + esc(s.me) + ') Hub দেখতে পারেন। অনুমতি আর ডিভাইসের তালিকা শুধু মালিক দেখেন।</p>'; return; }
  var users = s.users.map(function (u) {
    return '<div class="row"><span>' + esc(u) + '</span><button class="sbtn red" data-rm="' + esc(u) + '">বাদ দিন</button></div>';
  }).join('') || '<p>মালিক ছাড়া আর কেউ নেই।</p>';
  var dt = function (t) { return t ? new Date(t).toLocaleString('bn-BD', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—'; };
  var ses = s.sessions.map(function (x) {
    return '<div class="row"><span>' + esc(x.device) + (x.current ? ' <b style="color:var(--pos)">(এই ডিভাইস)</b>' : '') +
      '<small>' + esc(x.email) + ' · শেষ দেখা ' + dt(x.last) + '</small></span>' +
      (x.current ? '' : '<button class="sbtn red" data-rv="' + esc(x.id) + '">বের করুন</button>') + '</div>';
  }).join('');
  b.innerHTML = '<p>মালিক: <b>' + esc(s.owner) + '</b> — সবসময় ঢুকতে পারেন। দিনে একটা ইমেইলে সর্বোচ্চ ' + s.limit + 'টা কোড।</p>' +
    '<h4>যাঁরা Hub খুলতে পারবেন</h4>' + users +
    '<div class="add"><input id="secEm" type="email" placeholder="নতুন ইমেইল"><button class="sbtn pri" id="secAdd">যোগ করুন</button></div>' +
    '<h4>লগইন থাকা ডিভাইস (' + s.sessions.length + ')</h4>' + ses +
    (s.sessions.length > 1 ? '<button class="sbtn red" id="secOthers" style="margin-top:6px">অন্য সব ডিভাইস থেকে বের করে দিন</button>' : '');
  $('secAdd').onclick = function () { var v = $('secEm').value.trim(); if (v) secCall('apiAddUser', [v]); };
  b.querySelectorAll('[data-rm]').forEach(function (x) { x.onclick = function () { if (confirm(x.dataset.rm + ' — বাদ দেবেন? তাঁর সব লগইনও বন্ধ হবে।')) secCall('apiRemoveUser', [x.dataset.rm]); }; });
  b.querySelectorAll('[data-rv]').forEach(function (x) { x.onclick = function () { secCall('apiRevokeSession', [x.dataset.rv]); }; });
  if ($('secOthers')) $('secOthers').onclick = function () { if (confirm('এই ডিভাইস বাদে সব জায়গা থেকে লগআউট করবেন?')) secCall('apiRevokeOthers', []); };
}
